# Per-script environment variable configuration for automated runs
# (smoke tests, pre-release checks, CI).
#
# "defaults" are applied to every script on top of the inherited environment.
# "overrides" selectively unset or replace vars for matching path patterns.
#
# Pattern convention (same as no_run.yaml):
#   - Patterns containing '/' do a substring match against the file path
#     including extension (so patterns may end in `.py` to anchor against
#     the script form, e.g. `imaging/visualization.py` matches only the
#     `.py` script, not `imaging/visualization_jax.py`).
#   - Patterns without '/' match the file stem exactly.

defaults:
  PYAUTO_TEST_MODE: "2"                     # 0=normal, 1=reduced iterations, 2=skip sampler (fastest)
  PYAUTO_SMALL_DATASETS: "1"                # Cap grids/masks to 15x15, reduce MGE gaussians
  PYAUTO_DISABLE_JAX: "1"                   # Force use_jax=False, avoid JIT compilation overhead
  PYAUTO_FAST_PLOTS: "1"                    # Skip tight_layout() + critical curve/caustic overlays
  PYAUTO_SKIP_WORKSPACE_VERSION_CHECK: "1"  # profile-owned so the base-env scrub (#161 step 3) cannot drop the mega-run's CI injection
  JAX_ENABLE_X64: "True"                    # Enable 64-bit precision in JAX
  # XLA CPU intra-op thread pool: disable multithreaded Eigen (PyAutoFit#1528).
  #
  # WORKAROUND, NOT A ROOT-CAUSE FIX. The heaviest multi_dataset/composite JAX
  # vmap graphs intermittently never finish MATERIALISING their result -- the
  # compile completes in ~12-18s, then jax.block_until_ready / jax.Array._value
  # never returns and the runner caps it. Five scripts were quarantined across
  # the two test workspaces over a month under the wrong name ("XLA compile
  # stall"); the stacks say execution, not compilation.
  #
  # Measured, ABAB, imaging/jax_likelihood/mge_group.py, 3 repeats x 2 Python
  # legs at the 300s cap:
  #   default          4/4 HANG   (run 33076408637)
  #   cache disabled   6/6 HANG   (run 33078033016) -- cache hypothesis refuted
  #   flag + 2 others  6/6 PASS   (run 33080638510, slowest 63.2s)
  #   this flag alone  6/6 PASS   (run 33082896277, slowest 62.3s)
  #   default again    4/6 HANG   (run 33085024710, verdict STALL, bimodal)
  # 12 passes / 0 hangs with the flag against 2 passes / 14 hangs without;
  # Fisher exact p ~ 3e-6. Costs ~15% on this script (62.3s vs 54.4s when it
  # completes at all), and affects only JAX/XLA scripts since nothing else
  # reads XLA_FLAGS.
  #
  # Remove it if the underlying XLA CPU deadlock is ever fixed upstream.
  XLA_FLAGS: "--xla_cpu_multi_thread_eigen=false"
  NUMBA_CACHE_DIR: "/tmp/numba_cache"       # Writable cache dir for numba
  MPLCONFIGDIR: "/tmp/matplotlib"           # Writable config dir for matplotlib

# All former overrides here unset only the four declarable vars
# (PYAUTO_SMALL_DATASETS / PYAUTO_DISABLE_JAX / PYAUTO_FAST_PLOTS /
# PYAUTO_TEST_MODE) with no set: clause, so each has been migrated to an
# in-file `# ENV:` declaration on the matched script(s) — #187 Stage 2.
overrides:
  # JAX persistent-cache threshold for the interferometer Delaunay+MGE
  # JAX-likelihood script (PyAutoBrain /ci_speedup, 2026-09-10).
  #
  # COST: this script compiles 507 distinct XLA executables. Exactly ONE
  # (`jit(call)`, the vmapped likelihood, 2.54s) clears JAX's default
  # `jax_persistent_cache_min_compile_time_secs` of 1.0s — which is also what
  # `autonerves/jax_wrapper.py` os.environ.setdefault()s, so CI inherits it. The
  # other 506 compile in 12.9s and are NEVER written to the persistent cache, so
  # CI re-pays them on every run. The board's `cache_jax: HIT` is a hit on a
  # cache holding 1 entry (measured: `find <cachedir> -type f | wc -l` == 1).
  #
  # MEASURED (local, jax cache warm, numba cache warm, PROFILE=smoke,
  # `ENV: jax full_datasets`, harness `smoke_run.sh`):
  #   threshold 1.0 (the CI regime)   31.3s / 30.5s   cache dir: 1 entry, 324K
  #   threshold 0   (this override)   18.1s / 18.3s   cache dir: 729 entries, 4.4M
  #   cold dir, threshold 1.0         33.5s
  #   cold dir, threshold 0           34.7s   (+1.2s one-off, to write 506 entries)
  # The CI regime reproduces the board exactly: 30.5-31.3s local vs 32.2s (py3.13)
  # / 31.8s (py3.12) on run 34262404770.
  #
  # WHY EVERY ASSERTION SURVIVES: this is a compilation-*cache* policy knob. It
  # changes which XLA executables are persisted to disk, nothing about the graph,
  # the dtypes, the backend or the arithmetic. The script is not touched, so it
  # is identical under PROFILE=release. Verified byte-identical output either
  # side of the change: `JIT fit.log_likelihood: -3320.158760510604` and
  # `NumPy fit.log_likelihood: -3320.1587601763285` in all four runs above, RC=0.
  #
  # NOTE FOR THE HUMAN: this knob is script-independent — it is worth ~12s on
  # EVERY jax_likelihood/jax_grad script in the leg, not just this one (agent A1
  # measured the same effect on autolens imaging/jax_likelihood/delaunay.py). Its
  # right home is the `defaults:` block of this file, or PyAutoHeart's
  # `smoke-tests.yml` which owns the cache dir and its restore key. The
  # per-script `overrides:` block below is the minimal, in-lane form.
  #
  # `JAX_PERSISTENT_CACHE_MIN_ENTRY_SIZE_BYTES` is deliberately NOT set: JAX's
  # default for it is already 0 (jax/_src/config.py:1507), so setting it is a
  # no-op. Only the compile-time threshold differs from CI.
  # ---------------------------------------------------------------------------
  - pattern: interferometer/jax_likelihood/delaunay_mge.py
    set:
      JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS: "0"

