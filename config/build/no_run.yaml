- multi_dataset/jax_likelihood/rectangular.py # NEEDS_FIX 2026-08-29 - re-quarantined: hung 1805s at the release cap in release-integrate run 33244320906 with XLA_FLAGS=--xla_cpu_multi_thread_eigen=false in force — same execution-hang signature as the family below (epic xla-cpu-eigen-pool-deadlock). Restored 2026-08-27 by PyAutoFit#1528 (20.0s/21.9s in the family re-time below); intermittent since — it passed integrate runs 33230028707 and 33255903385 the same day. Fourth family member re-quarantined, after autolens_workspace_test's delaunay.py, shared_preloads.py and delaunay_mge.py. Stays on the smoke gate (smoke_tests.txt), which deliberately does not apply this file.

- multi_dataset/jax_likelihood/delaunay.py # NEEDS_FIX 2026-09-07 - quarantined: TIMEOUT 1805s at the release cap in TWO CONSECUTIVE release-integrate runs (34018429178, 34094964905) with XLA_FLAGS=--xla_cpu_multi_thread_eigen=false in force. Fifth family member (epic xla-cpu-eigen-pool-deadlock, XLA FftThunk/ducc0 Eigen-pool deadlock), and the direct twin of autolens_workspace_test's identically-named multi_dataset/jax_likelihood/delaunay.py. Both captured stacks park in jax _pjit_call_impl - EXECUTION, not compilation - reached via vmap_f -> flatten_fun_for_vmap -> cache_miss -> _pjit_batcher, i.e. the inner pjit that Fitness._vmap = jax.vmap(jax.jit(call)) eagerly executes while re-tracing, which it does on EVERY call. The two runs hung on DIFFERENT calls of the same graph, matching the two signatures already documented in the sister repo: 34094964905 at delaunay.py:201, the SECOND _vmap (jax_compile.py:306) after the first completed in 4.1s and printed its result - the autolens delaunay.py signature; 34018429178 at delaunay.py:196, the FIRST _vmap (jax_compile.py:320) with the heartbeat still logging 'still compiling' at 1770s - the autolens delaunay_mge.py / shared_preloads.py signature. A random per-execution deadlock with two exposures per script run; not a compile stall and not a profile split. NOT reproducible on the dev box, and the box cannot reproduce the family at all: 10/10 PASS under profile_release.yaml (10-25s, cold JAX cache each attempt), 2/2 under profile_smoke.yaml, and 4/4 with the eigen flag REMOVED - the configuration that gave 14/16 hangs in CI - so local evidence cannot discriminate here. RULED OUT by measurement: (a) the release profile, whose resolved env differs from smoke in only PYAUTO_TEST_MODE 2->0 and PYAUTO_FAST_PLOTS 1->0, neither of which this search-less, plot-less script reads (the two runs' logs are byte-identical apart from timestamps and durations, 716 masked pixels under both); (b) the mesh/mask ratio from eec09d6's pixel_scales 0.1->0.2, since sibling delaunay_mge.py has the identical pixels=500 / pixel_scales=0.2 / mask_radius=3.0 / 716 mask pixels (ratio 0.70) and passed 28.3s and 29.4s in the same two runs. CONTAINMENT, NOT A FIX - remove when the epic lands. Stays on the smoke gate (smoke_tests.txt), which deliberately does not apply this file.

# The jax-compile-stall family is RESTORED (PyAutoFit#1528, 2026-08-27). Three
# entries were removed from this file and re-enabled in smoke_tests.txt:
#
#   multi_dataset/jax_likelihood/rectangular.py   NEEDS_FIX 2026-08-01
#   imaging/jax_likelihood/mge_group.py           NEEDS_FIX 2026-08-23
#   imaging/jax_likelihood/rectangular_mge.py     NEEDS_FIX 2026-08-23
#
# The name every marker used was wrong. It is NOT an XLA compile stall: the
# captured stacks put the process in jax.block_until_ready / jax.Array._value
# with compilation already finished in ~12-18s. It is an execution hang --
# materialising the vmap result never returns.
#
# The trigger is XLA CPU's multithreaded Eigen thread pool.
# profile_smoke.yaml and profile_release.yaml now set
# XLA_FLAGS=--xla_cpu_multi_thread_eigen=false. ABAB on autolens_workspace_test's
# imaging/jax_likelihood/mge_group.py, 3 repeats x 2 Python legs at the 300s
# cap: 12 passes / 0 hangs with the flag against 2 passes / 14 hangs without
# (Fisher exact p ~ 3e-6).
#
# Family re-time with the flag (run 33087271848), 3 repeats x 2 legs, 18/18
# completions, verdict NEITHER on every entry and every leg:
#   multi_dataset/jax_likelihood/rectangular.py  20.0s / 21.9s
#   imaging/jax_likelihood/mge_group.py          32.8s / 32.6s
#   imaging/jax_likelihood/rectangular_mge.py    22.9s / 24.1s
#
# This is a WORKAROUND, not a root-cause fix: we know where it hangs and what
# avoids it, not why XLA's CPU thread pool wedges on these graphs. If the flag
# is ever removed, expect these three back.
